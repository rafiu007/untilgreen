# Agent CLI flags drift monthly (constitution: operational cautions).
# This nightly matrix installs the LATEST agent CLIs and runs a smoke
# workflow against each; failures open an issue instead of failing silently.
name: nightly-adapter-smoke

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [claude-code, codex]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Probes flag surface only (no API key needed): --help parsing,
      # version detection, doctor checks. Full invocation smoke runs are
      # gated on repository secrets being present.
      - name: Install latest agent CLI
        run: |
          case "${{ matrix.adapter }}" in
            claude-code) npm install -g @anthropic-ai/claude-code ;;
            codex)       npm install -g @openai/codex ;;
          esac
      - name: Doctor probe
        run: node packages/cli/dist/index.js doctor --adapter ${{ matrix.adapter }} --json
      - name: Open issue on drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `nightly: ${{ matrix.adapter }} adapter drift detected (${new Date().toISOString().slice(0,10)})`,
              body: `The nightly smoke run against the latest ${{ matrix.adapter }} CLI failed. Flags may have drifted. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['adapter-drift'],
            })
